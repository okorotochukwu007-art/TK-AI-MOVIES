<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function () {
        function isExtensionError(msg, stack, filename) {
          var combined =
            String(msg || '') +
            ' ' +
            String(stack || '') +
            ' ' +
            String(filename || '');
          return (
            combined.indexOf('MetaMask') !== -1 ||
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('safari-extension://') !== -1 ||
            combined.indexOf('inpage.js') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            if (
              isExtensionError(
                e && e.message,
                e && e.error && e.error.stack,
                e && e.filename
              )
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e && e.reason;
            var msg =
              (reason && (reason.message || String(reason))) || '';
            var stack = (reason && reason.stack) || '';
            if (isExtensionError(msg, stack, '')) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
