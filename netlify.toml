[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["supabase/schema.sql", "data/**"]

# Automatically run YouTube AI movie discovery every 2 hours on Netlify
[functions."scheduled-discover"]
  schedule = "0 */2 * * *"

# Route all /api/* requests to the Express backend running inside Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Fallback for direct deep links (?movie=...) and client routes
# Static files in dist/ (including /sitemap.xml and /robots.txt) are served directly before this non-forced rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

